<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BI Factory · Produtos</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#24354b;font:14px system-ui,Arial}header{background:#fff;border-bottom:1px solid #e1e8f0;padding:22px max(24px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:25px}main{max-width:1200px;margin:32px auto;padding:0 20px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.card{background:#fff;border:1px solid #e0e8f1;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #1c3c6510}button,.button{display:inline-block;border:1px solid #bfcfe0;border-radius:8px;padding:10px 14px;background:white;color:#24354b;cursor:pointer;text-decoration:none;font:inherit}.primary{background:#1769ad;color:white;border-color:#1769ad}.muted{color:#667a90;font-size:12px}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #c7d3df;border-radius:8px;padding:10px;font:inherit;background:#fff}textarea{min-height:70px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid .wide{grid-column:span 3}.actions{display:flex;gap:8px;flex-wrap:wrap}#formbox{display:none}#notice{margin:12px 0;color:#1769ad}.tag{background:#eaf3fa;padding:5px 9px;border-radius:20px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.grid .wide{grid-column:span 1}}
</style></head><body><header><div><h1>Produtos de Informação</h1><span class="muted">BI Factory SEPPE · Catálogo e edição visual</span></div><button class="primary" id="new">+ Novo produto</button></header><main><div id="notice"></div><section id="formbox" class="card"><div class="row"><h2 id="formtitle">Novo produto</h2><button id="cancel">Fechar</button></div><form id="form"><div class="grid"><div><label>Nome *</label><input name="name" required maxlength="180"></div><div><label>Tipo de produto</label><select name="type"><option>Painel</option><option>Portal</option><option>PDF</option><option>Relatório</option><option>Documento</option></select></div><div><label>Visibilidade</label><select name="visibility"><option>Interno</option><option>Restrito</option><option>Público</option></select></div><div class="wide"><label>Descrição</label><textarea name="description"></textarea></div><div><label>Projeto vinculado</label><input name="project"></div><div><label>Responsável pelo produto</label><input name="owner"></div><div><label>Responsável técnico</label><input name="technical_owner"></div><div><label>Público-alvo</label><input name="audience"></div><div><label>Atualização</label><select name="refresh_policy"><option>Manual</option><option>Conforme fonte</option><option>Diária</option><option>Semanal</option><option>Mensal</option></select></div><div><label>Destino / distribuição</label><input name="destination"></div><div class="wide"><label>Observações</label><textarea name="notes"></textarea></div></div><p class="muted">Chave, criação e atualização são geradas automaticamente.</p><button type="submit" class="primary">Salvar cadastro</button></form></section><div class="row"><h2>Produtos cadastrados</h2><input id="search" placeholder="Pesquisar produtos…" style="max-width:320px"></div><div id="list"></div></main><script>
const $=id=>document.getElementById(id);let products=[],editing=null;
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){const r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'Falha na requisição');return data}
function date(s){return s?new Date(s).toLocaleString('pt-BR'):'—'}
function render(){const q=$('search').value.toLocaleLowerCase('pt-BR');const list=$('list');list.replaceChildren();for(const p of products.filter(x=>[x.name,x.code,x.description,x.owner,x.project].join(' ').toLocaleLowerCase('pt-BR').includes(q))){const section=document.createElement('section');section.className='card';section.innerHTML='<div class="row"><div><h3>'+escape(p.name)+'</h3><span class="tag">'+escape(p.type)+'</span> <span class="tag">'+escape(p.status)+'</span> <span class="tag">'+escape(p.visibility)+'</span><p class="muted">'+escape(p.code)+' · Versão '+escape(p.version)+' · Criado '+date(p.created_at)+' · Atualizado '+date(p.updated_at)+'</p><p>'+escape(p.description)+'</p><p class="muted">Responsável: '+escape(p.owner||'Não informado')+' · Projeto: '+escape(p.project||'Não informado')+'</p></div><div class="actions"><button data-edit="'+escape(p.id)+'">Metadados</button><a class="button primary" href="/index.html?product='+encodeURIComponent(p.id)+'">Abrir editor visual</a></div></div>';list.append(section)}if(!list.children.length)list.textContent='Nenhum produto encontrado.';list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(products.find(p=>p.id===b.dataset.edit)))}
async function refresh(){products=await api('/products');render()}
function openForm(p){editing=p?.id||null;$('formtitle').textContent=p?'Editar metadados · '+p.code:'Novo produto';const form=$('form');form.reset();for(const el of form.elements){if(el.name&&p&&p[el.name]!=null)el.value=p[el.name]}form.elements.type.disabled=!!p;$('formbox').style.display='block';$('formbox').scrollIntoView({behavior:'smooth'})}
$('new').onclick=()=>openForm(null);$('cancel').onclick=()=>$('formbox').style.display='none';$('search').oninput=render;
$('form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{const p=await api(editing?'/products/'+editing:'/products',editing?'PATCH':'POST',data);$('notice').textContent='Produto '+p.code+' salvo com sucesso.';$('formbox').style.display='none';await refresh()}catch(err){$('notice').textContent='Erro: '+err.message}};
refresh().catch(err=>$('notice').textContent='Não foi possível carregar o catálogo: '+err.message);
</script></body></html>
