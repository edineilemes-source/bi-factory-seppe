*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:#203047;background:#f4f7fb}header{padding:16px 22px;background:white;border-bottom:1px solid #dae2ec;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}button{padding:9px 12px;border:1px solid #cdd9e7;border-radius:8px;background:white;cursor:pointer}button.primary{background:#1769ad;color:white}.layout{display:grid;grid-template-columns:235px minmax(380px,1fr) 265px;min-height:calc(100vh - 72px)}aside{padding:16px;background:white;border-right:1px solid #dde4ee}aside.right{border-right:0;border-left:1px solid #dde4ee}h2{font-size:15px}main{padding:18px;min-width:0}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.canvas{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;min-height:450px;padding:12px;border:2px dashed #d5e0eb;border-radius:10px}.tile{grid-column:span 6;min-width:0;background:white;padding:12px;border:1px solid #d7e0ea;border-radius:10px;cursor:grab}.tile.selected{outline:2px solid #2376bf}.tile.kpi-tile,.tile.kpi-tile.selected{border:0!important;outline:0!important;box-shadow:none!important;background:transparent!important;min-width:0!important;padding:4px!important}.kpi-tile .head{display:block!important}.kpi-tile .head strong{font-size:14px;font-weight:600}.kpi-tile .plot{height:auto!important;min-height:42px!important;white-space:normal!important;overflow:visible!important;font-variant-numeric:tabular-nums}.kpi-tile .head button{display:none}.kpi-tile .head{margin:0!important;padding:0!important}.head{display:flex;justify-content:space-between;align-items:center}.plot{height:265px}.empty{grid-column:span 12;text-align:center;padding:85px 10px;color:#77879c}.field{border-bottom:1px solid #e6edf4;padding:9px 0}.note{font-size:12px;color:#62758a;line-height:1.5}label{display:block;font-weight:bold;font-size:12px;margin:14px 0 5px}select,input{width:100%;padding:8px;border:1px solid #cdd9e7;border-radius:6px}se </style></head><body><header><div><h1>BI Factory · Estúdio Visual</h1><div id="status" class="note">Carregando dados…</div></div><div><button id="publish-all" class="primary">Atualizar tudo na 8503</button> <button id="clear">Página vazia</button> <button id="save" class="primary">Exportar JSON</button></div></header><div class="layout"><aside><h2>Conjunto de dados</h2><p class="note">SICONFI/RREO · 2022 a 2026. Valores acumulados por bimestre.</p>
<label for="dataset-year">Ano dos dados</label><select id="dataset-year"><option value="">Todos os anos disponíveis</option></select>
<label for="dataset-bimester">Bimestre</label><select id="dataset-bimester"><option value="">Todos os bimestres</option></select>
<p id="coverage" class="note">Consultando anos e bimestres publicados...</p>
<h2>Dimensões disponíveis</h2><div id="dimension-catalog"></div>
<h2>Medidas disponíveis</h2><div id="fields"></div></aside><main><div id="toolbar" class="toolbar"></div><div id="canvas" class="canvas"></div></main><aside class="right"><h2>Propriedades</h2><div id="props" class="note">Selecione um gráfico.</div></aside></div><script>
const fields={"Receita realizada":"receita_realizada_acumulada","Despesa empenhada":"despesa_empenhada_acumulada","Despesa liquidada":"despesa_liquidada_acumulada","Despesa paga":"despesa_paga_acumulada","Resultado orçamentário formal":"resultado_orcamentario_formal","Margem receita × liquidada":"margem_receita_menos_liquidada","Liquidada não paga":"liquidada_nao_paga"};
const EMBEDDED=new URLSearchParams(location.search).has('embed');if(EMBEDDED){document.addEventListener('DOMContentLoaded',()=>{document.getElementById('publish-all').style.display='none';document.getElementById('clear').style.display='none';document.getElementById('save').textContent='Inserir gráfico no produto';document.getElementById('save').classList.add('primary')})}const types=[["KPI","KPI"],["LINE","Linhas"],["BAR","Colunas agrupadas"],["STACK","Empilhadas"],["HORIZONTAL","Barras horizontais"],["RANKING","Ranking horizontal"],["POINTS","Pontos por período"],["SCATTER","Dispersão X × Y"],["AREA","Área"],["PIE","Pizza"],["DONUT","Rosca"],["TABLE","Tabela"]];
const colors=["#168BAF","#E3A243","#35A78B","#727AD1","#D65A75"];let data=[],items=[],selected=null,charts=[],loadedProduct=null;
const DIMENSIONS={ano:"Ano",bimestre:"Bimestre"};
const params=new URLSearchParams(location.search);
let yearFilter=params.get("ano")||"", bimesterFilter=params.get("bimestre")||"";
const validYear=v=>["2022","2023","2024","2025","2026"].includes(String(v));
const validBim=v=>["1","2","3","4","5","6"].includes(String(v));
if(!validYear(yearFilter))yearFilter="";
if(!validBim(bimesterFilter))bimesterFilter="";
function refreshSelectors(){
 const years=[...new Set(data.map(r=>String(r.ano??r.exercicio)).filter(validYear))].sort();
 const y=el("dataset-year"),b=el("dataset-bimester");
 y.replaceChildren(new Option("Todos os anos disponíveis",""));
 for(const year of ["2022","2023","2024","2025","2026"]){const o=new Option(year+(years.includes(year)?"":" · sem dados"),year);o.disabled=!years.includes(year);y.add(o)}
 b.replaceChildren(new Option("Todos os bimestres",""));
 const periods=[...new Set(data.filter(r=>!yearFilter||String(r.ano??r.exercicio)===yearFilter).map(r=>String(r.bimestre)).filter(validBim))];
 for(let period=1;period<=6;period++){const n=String(period);const o=new Option(period+"º bimestre"+(periods.includes(n)?"":" · sem dados"),n);o.disabled=!periods.includes(n);b.add(o)}
 if(yearFilter&&!years.includes(yearFilter))yearFilter="";
 if(bimesterFilter&&!periods.includes(bimesterFilter))bimesterFilter="";
 y.value=yearFilter;b.value=bimesterFilter;
 const covered=new Set(data.map(r=>String(r.ano??r.exercicio)+"-"+r.bimestre));
 el("coverage").textContent="Períodos com dados: "+covered.size+" de 30 previstos. Períodos não importados não geram valores.";
}
function updateDatasetFilter(){yearFilter=el("dataset-year").value;bimesterFilter=el("dataset-bimester").value;refreshSelectors();redraw()}

const el=id=>document.getElementById(id),node=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n},money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}).format(v);
function sendAll(){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:{action:"sync_all",components:items.map(({id,type,title,metrics,width,bg,text,colors})=>({id,type,title,metrics,width,bg,text,colors})),product_id:loadedProduct,event_id:crypto.randomUUID()},dataType:"json"},"*");el("status").textContent="Sincronizando produto completo com a 8503…"}
el("publish-all").onclick=sendAll;
function sendPublication(item){const event={action:"publish",component:item,product_id:loadedProduct,event_id:crypto.randomUUID()};window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:event,dataType:"json"},"*");const status=el("status");status.textContent="Envio solicitado para 8503 · aguardando confirmação da BI Factory";}
function sendRemoval(item){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:{action:"unpublish",component:{id:item.id},product_id:loadedProduct,event_id:crypto.randomUUID()},dataType:"json"},"*");el("status").textContent="Retirada solicitada · aguardando confirmação da BI Factory"}
function redraw(){charts.forEach(c=>c.dispose());charts=[];const root=el("canvas");root.replaceChildren();if(!items.length){const n=node("div","Selecione um tipo de gráfico acima para começar.");n.className="empty";root.append(n)}
items.forEach(item=>{const tile=node("section");tile.className="tile"+(item.id===selected?" selected":"")+(item.type==="KPI"?" kpi-tile":"");tile.style.gridColumn="span "+(item.type==="KPI"?Math.max(4,item.width):item.width);tile.style.background=item.type==="KPI"?"transparent":item.bg;tile.style.color=item.text;if(item.type==="KPI"){tile.style.border="0";tile.style.boxShadow="none";tile.style.padding="2px";tile.style.cursor="pointer"}tile.draggable=true;tile.ondragstart=e=>e.dataTransfer.setData("text/plain",item.id);tile.ondragover=e=>e.preventDefault();tile.ondrop=e=>{e.preventDefault();const a=items.findIndex(x=>x.id===e.dataTransfer.getData("text/plain")),b=items.indexOf(item);if(a<0)return;items.splice(b,0,items.splice(a,1)[0]);redraw()};tile.onclick=()=>{selected=item.id;redraw();properties()};const head=node("div");head.className="head";if(item.title)head.append(node("strong",item.title));const close=node("button","×");close.onclick=e=>{e.stopPropagation();items=items.filter(x=>x!==item);if(selected===item.id)selected=null;redraw();properties()};head.append(close);tile.append(head);if(item.type==="KPI"){head.style.border="0";head.style.padding="0";head.style.margin="0";}const plot=node("div");plot.className="plot";if(item.type==="KPI"){plot.style.height="auto";plot.style.minHeight="60px";plot.style.padding="8px 0";plot.style.whiteSpace="normal"}tile.append(plot);const publish=node("button",item.published?"Atualizar na 8503":"Enviar para 8503");publish.className="primary";publish.style.marginTop="10px";publish.onclick=e=>{e.stopPropagation();sendPublication(item)};if(!EMBEDDED)tile.append(publish);if(item.published&&!EMBEDDED){const unpublish=node("button","Retirar da 8503");unpublish.style.marginLeft="8px";unpublish.onclick=e=>{e.stopPropagation();sendRemoval(item)};tile.append(unpublish)}root.append(tile);draw(item,plot)})}
function draw(item,plot){
 const dimensions=(item.dimensions||["bimestre"]).filter(d=>DIMENSIONS[d]);
 let rows=data.filter(r=>(!yearFilter||String(r.ano??r.exercicio)===yearFilter)&&(!bimesterFilter||String(r.bimestre)===bimesterFilter))
   .sort((a,b)=>Number(a.ano??a.exercicio)-Number(b.ano??b.exercicio)||Number(a.bimestre)-Number(b.bimestre));
 // RREO é acumulado: a dimensão somente Ano usa o último bimestre, nunca soma os seis.
 if(dimensions.includes("ano")&&!dimensions.includes("bimestre")){
   const byYear=new Map();rows.forEach(row=>byYear.set(String(row.ano??row.exercicio),row));rows=[...byYear.values()];
 }
 const keys=item.metrics.map(m=>fields[m]).filter(Boolean);
 const multiYear=!yearFilter&&new Set(rows.map(r=>r.ano??r.exercicio)).size>1;
 const labelOf=r=>dimensions.includes("ano")&&!dimensions.includes("bimestre")?String(r.ano??r.exercicio):
   (multiYear?String(r.ano??r.exercicio)+" / ":"")+r.bimestre+"º bim.";
if(!rows.length){plot.textContent="Não há registros para o exercício selecionado. Verifique o campo ano/exercicio.";return}if(item.type==="KPI"){plot.style.padding="8px 0";plot.style.fontSize="clamp(17px,2vw,27px)";plot.textContent=rows.at(-1)[keys[0]]==null?"Valor indisponível":money(Number(rows.at(-1)[keys[0]]));return}if(item.type==="TABLE"){const t=node("table"),h=node("tr");[dimensions.includes("ano")?"Ano / Bimestre":"Bimestre",...item.metrics].forEach(x=>h.append(node("th",x)));t.append(h);rows.forEach(r=>{const tr=node("tr");[labelOf(r),...keys.map(k=>r[k]===null||r[k]===undefined?"—":money(Number(r[k])))].forEach(v=>tr.append(node("td",v)));t.append(tr)});plot.style.overflow="auto";plot.append(t);return}if(!window.echarts){plot.textContent="ECharts indisponível";return}const options=window.BIFactoryChartOptions?.build({
 spec:item,rows,keys,metrics:item.metrics,labels:rows.map(labelOf)
});
if(!options){plot.textContent="Para dispersão X × Y, selecione duas medidas diferentes.";return}
const chart=echarts.init(plot);charts.push(chart);chart.setOption(options)}
function properties(){const root=el("props");root.replaceChildren();const item=items.find(x=>x.id===selected);if(!item){root.textContent="Selecione um gráfico.";return}function field(label,control){root.append(node("label",label));root.append(control)}const title=node("input");title.placeholder="Nome do gráfico ou KPI";title.value=item.title;title.onchange=()=>{item.title=title.value;redraw()};field("Título",title);const sel=node("select");sel.multiple=true;Object.keys(fields).forEach(m=>{const o=node("option",m);o.value=m;o.selected=item.metrics.includes(m);sel.append(o)});field("Medidas (Ctrl+clique para selecionar várias)",sel);
 const dim=node("select");dim.multiple=true;dim.style.minHeight="72px";
 Object.entries(DIMENSIONS).forEach(([key,label])=>{const option=new Option(label,key);option.selected=(item.dimensions||["bimestre"]).includes(key);dim.add(option)});
 field("Dimensões do gráfico",dim);const appliesToXY=item.type==="SCATTER";
 const topN=node("select");
 for(const [value,label] of [["5","Top 5"],["10","Top 10"],["15","Top 15"],["20","Top 20"],["0","Todos"]]){const o=new Option(label,value);topN.add(o)}
 topN.value=String(item.topN??10);
 if(item.type==="RANKING")field("Quantidade de categorias no ranking",topN);
 const showLabels=node("input");showLabels.type="checkbox";showLabels.style.width="auto";
 showLabels.checked=Boolean(item.showLabels??(item.type==="RANKING"));
 const labelRow=node("label");labelRow.style.cssText="display:flex;align-items:center;gap:8px;font-weight:normal";
 labelRow.append(showLabels,node("span","Mostrar valores diretamente no gráfico"));root.append(labelRow);
 const info=node("p","Dimensões disponíveis na base RREO: Ano e Bimestre. Unidade Gestora, Mês, Dia, Fonte e Elemento de Despesa requerem uma base detalhada; não são inferidos do RREO.");
 info.className="note";root.append(info);
 const apply=node("button","Aplicar campos e atualizar gráfico");apply.className="primary";apply.style.marginTop="8px";apply.style.width="100%";apply.onclick=()=>{const v=[...sel.selectedOptions].map(o=>o.value);if(!v.length){alert("Selecione pelo menos uma medida.");return}
 if(appliesToXY&&v.length<2){alert("O gráfico de dispersão exige duas medidas: eixo X e eixo Y.");return}const selectedDimensions=[...dim.selectedOptions].map(o=>o.value);
 if(!selectedDimensions.length){alert("Selecione pelo menos uma dimensão.");return}
 item.dimensions=selectedDimensions;item.dimension=selectedDimensions.at(-1);
 item.topN=Number(topN.value);item.showLabels=showLabels.checked;
 item.metrics=["KPI","RANKING","PIE","DONUT"].includes(item.type)?v.slice(0,1):v;
 if(appliesToXY){item.scatterX=fields[v[0]];item.scatterY=fields[v[1]]}
 item.colors=item.metrics.map((_,i)=>item.colors[i]||colors[i%colors.length]);redraw();properties()};root.append(apply);const width=node("select");[3,4,6,8,12].forEach(w=>{const o=node("option",w+" colunas");o.value=w;o.selected=item.width===w;width.append(o)});width.onchange=()=>{item.width=Number(width.value);redraw()};field("Largura",width);for(const [key,label] of [["bg","Cor de fundo"],["text","Cor do texto"]]){const c=node("input");c.type="color";c.value=item[key];c.oninput=()=>{item[key]=c.value;redraw()};field(label,c)}item.metrics.forEach((m,i)=>{const c=node("input");c.type="color";c.value=item.colors[i]||colors[i%colors.length];c.oninput=()=>{item.colors[i]=c.value;redraw()};field("Cor da série: "+m,c)});root.append(node("p","Arraste os gráficos para reorganizar."))}
types.forEach(([type,label])=>{const b=node("button","+ "+label);b.onclick=()=>{const m=Object.keys(fields)[0],item={id:String(Date.now())+Math.random(),type,title:"",metrics:type==="SCATTER"?Object.keys(fields).slice(0,2):[m],dimensions:["ano","bimestre"],dimension:"bimestre",width:type==="KPI"?3:6,topN:10,showLabels:type==="RANKING",bg:"#ffffff",text:"#203047",colors:[colors[0]]};const title=prompt("Qual é o nome deste "+(type==="KPI"?"KPI":"gráfico")+"?","");if(title===null)return;item.title=title.trim();items.push(item);selected=item.id;redraw();properties()};el("toolbar").append(b)});
Object.entries(DIMENSIONS).forEach(([key,label])=>{const n=node("div",label);n.className="field";el("dimension-catalog").append(n)});
 Object.keys(fields).forEach(m=>{const n=node("div",m);n.className="field";el("fields").append(n)});
 el("dataset-year").onchange=()=>{yearFilter=el("dataset-year").value;bimesterFilter="";refreshSelectors();redraw()};
 el("dataset-bimester").onchange=()=>{bimesterFilter=el("dataset-bimester").value;redraw()};
el("clear").onclick=()=>{if(items.length&&!confirm("Limpar todos os objetos?"))return;items=[];selected=null;redraw();properties()};
el("save").onclick=()=>{if(EMBEDDED){const item=items.find(i=>i.id===selected)||items.at(-1);if(!item){alert('Crie ou selecione um gráfico.');return}window.parent.postMessage({type:'bi-factory:chart-selected',chart:{id:item.id,type:item.type,title:item.title,metrics:item.metrics,dimensions:item.dimensions||["ano","bimestre"],dimension:item.dimension||"bimestre",showLabels:Boolean(item.showLabels),topN:Number(item.topN??10),scatterX:item.scatterX||null,scatterY:item.scatterY||null,colors:item.colors,bg:item.bg,text:item.text,width:item.width},filters:{ano:yearFilter,bimestre:bimesterFilter},rows:data},location.origin);return}const blob=new Blob([JSON.stringify({source:"SICONFI RREO 2022-2026",components:items},null,2)],{type:"application/json"});const a=node("a");a.href=URL.createObjectURL(blob);a.download="bi-factory-studio.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
(window.BI_FACTORY_DATA ? Promise.resolve(window.BI_FACTORY_DATA) : fetch("/api/fiscal").then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()})).then(rows=>{data=rows;refreshSelectors();el("status").textContent=rows.length+" registros · fonte oficial";redraw()}).catch(e=>el("status").textContent="Falha na fonte: "+e.message);redraw();
window.addEventListener("message",e=>{if(e.origin!==location.origin||e.data?.type!=="bi-factory:edit-chart")return;const spec=e.data.chart;if(!spec)return;const copy={id:spec.id||crypto.randomUUID(),type:spec.type||"LINE",title:spec.title||"Gráfico",metrics:spec.metrics||[Object.keys(fields)[0]],showLabels:spec.showLabels,topN:spec.topN,scatterX:spec.scatterX,scatterY:spec.scatterY,dimensions:spec.dimensions||[spec.dimension||"bimestre"],dimension:spec.dimension||"bimestre",width:spec.width||6,bg:spec.bg||"#fff",text:spec.text||"#203047",colors:spec.colors||[]};items=[copy];selected=copy.id;redraw();properties()});
window.addEventListener("message",e=>{if(e.data?.type!=="streamlit:render")return;const args=e.data.args||{};if(Array.isArray(args.rows)){data=args.rows;refreshSelectors();el("status").textContent=data.length+" registros · fonte oficial";redraw()}if(args.load_published===true&&Array.isArray(args.published_components)&&!window.__publishedLoaded){window.__publishedLoaded=true;loadedProduct=args.product_id||null;const names=Object.entries(fields);items=args.published_components.map((c,i)=>{const subtype=c.visual_subtype||c.component_type||"LINE";const metrics=(c.metrics||[]).map(m=>m.label||names.find(([,key])=>key===m.field)?.[0]).filter(m=>fields[m]);return {id:String(c.id||"legacy-"+i),type:subtype,title:c.title||"Gráfico",metrics:metrics.length?metrics:[names[0][0]],showLabels:c.showLabels,topN:c.topN,scatterX:c.scatterX,scatterY:c.scatterY,dimensions:c.dimensions||["bimestre"],dimension:c.dimension||"bimestre",width:Number(c.position?.width)||6,bg:c.background_color||"#ffffff",text:c.text_color||"#203047",colors:c.series_colors||[],published:true}});selected=items[0]?.id||null;redraw();properties()}if(args.result){el("status").textContent=args.result.message||args.result;if(args.result.id){const item=items.find(i=>i.id===args.result.id);if(item){item.published=args.result.published;redraw()}}}});window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*");window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height:920},"*");
</script></body></html>
