<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BI Factory · Editor Visual (POC)</title>
<link href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#23344a;font:14px Arial}header{display:flex;gap:12px;align-items:center;padding:12px 18px;background:#fff;border-bottom:1px solid #d9e1eb}header strong{font-size:19px;margin-right:auto}button{background:#fff;border:1px solid #b8c8d8;padding:9px 12px;border-radius:6px;cursor:pointer}button.primary{background:#1769ad;color:#fff}.layout{display:grid;grid-template-columns:210px minmax(400px,1fr) 245px;min-height:calc(100vh - 62px)}aside{background:white;padding:17px;border-right:1px solid #d9e1eb}aside.right{border-left:1px solid #d9e1eb;border-right:0}aside button{width:100%;margin-bottom:8px;text-align:left}main{padding:22px;overflow:auto}.grid-stack{background:#fff;min-height:620px;border:1px solid #d9e1eb;border-radius:7px;background-image:linear-gradient(#edf2f7 1px,transparent 1px),linear-gradient(90deg,#edf2f7 1px,transparent 1px);background-size:24px 24px}.grid-stack-item-content{background:#fff;border:1px solid #b8c8d8;border-radius:7px;overflow:auto;padding:12px;cursor:move;box-shadow:0 2px 7px #0001}.grid-stack-item.selected .grid-stack-item-content{outline:2px solid #1769ad}label{display:block;margin-top:12px;font-weight:bold;font-size:12px}input,textarea,select{width:100%;padding:8px;margin-top:5px;border:1px solid #bac7d6;border-radius:5px}textarea{min-height:90px}.content{white-space:pre-wrap;overflow-wrap:anywhere}.widget-title{font-weight:bold;margin-bottom:8px}.muted{font-size:12px;color:#62758a}.preview aside{display:none}.preview .layout{display:block}.preview main{padding:12px}.preview .grid-stack-item-content{cursor:default}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{border-bottom:1px solid #ddd}}
</style></head><body>
<header><strong id="product-name">BI Factory · Editor Visual</strong><a href="/" style="color:#1769ad;text-decoration:none">← Produtos</a><button id="preview">Visualizar</button><button id="save" class="primary">Salvar no navegador</button><button id="export">Exportar JSON</button><button id="import">Importar JSON</button><input id="file" type="file" accept=".json,application/json" hidden></header>
<div class="layout"><aside><h3>Objetos</h3><button data-add="text">+ Texto</button><button data-add="image">+ Imagem</button><button data-add="dashboard">+ Gráficos / dashboards · Abrir ECharts</button><h3>Figuras geométricas</h3><button data-add="rectangle">▭ Retângulo</button><button data-add="square">□ Quadrado</button><button data-add="diamond">◇ Losango</button><button data-add="ellipse">◯ Elipse</button><button data-add="arrow">➜ Seta</button><button data-add="line">━ Linha</button><button data-add="title">+ Título</button><p class="muted">Arraste os objetos e redimensione pelas bordas. Este protótipo não publica dados nem altera o BI Factory.</p></aside><main><div class="grid-stack"></div><p class="muted" id="status">Layout local · sem autenticação ou publicação.</p></main><aside class="right"><h3>Propriedades</h3><div id="properties">Selecione um objeto.</div></aside></div>
<script>
'use strict';
const KEY='bi-factory-gridstack-poc-v1';const PRODUCT=new URLSearchParams(location.search).get('product');
const grid=GridStack.init({column:12,cellHeight:72,margin:8,float:true,disableOneColumnMode:true},'.grid-stack');
let objects={},selected=null,preview=false;const charts=new Map();const fields={"Receita realizada":"receita_realizada_acumulada","Despesa empenhada":"despesa_empenhada_acumulada","Despesa liquidada":"despesa_liquidada_acumulada","Despesa paga":"despesa_paga_acumulada","Resultado orçamentário formal":"resultado_orcamentario_formal","Margem receita × liquidada":"margem_receita_menos_liquidada","Liquidada não paga":"liquidada_nao_paga"};let fiscalRows=[];
const $=id=>document.getElementById(id);
function makeId(){return crypto.randomUUID()}
function defaultObj(type){return {id:makeId(),type,title:type==='title'?'Novo título':type==='dashboard'?'Dashboard':'',text:type==='text'?'Digite seu texto aqui':'',image:'',bg:'#ffffff',color:'#203047',size:type==='title'?28:16,chart:null}}
function content(obj){const box=document.createElement('div');box.style.background=obj.bg;box.style.color=obj.color;box.style.height='100%';if(obj.title){const h=document.createElement('div');h.className='widget-title';h.style.fontSize=obj.type==='title'?obj.size+'px':'16px';h.textContent=obj.title;box.append(h)}
if(obj.type==='text'){const p=document.createElement('div');p.className='content';p.style.fontSize=obj.size+'px';p.textContent=obj.text;box.append(p)}
if(obj.type==='image'){if(obj.image){const im=document.createElement('img');im.src=obj.image;im.alt=obj.title||'Imagem';im.style.cssText='max-width:100%;max-height:100%;object-fit:contain';box.append(im)}else box.append(document.createTextNode('Selecione uma imagem nas propriedades.'))}
if(['rectangle','square','diamond','ellipse','arrow','line'].includes(obj.type)){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 400 200');svg.style.cssText='width:100%;height:100%';const ns='http://www.w3.org/2000/svg';let tag='rect',attrs={x:20,y:20,width:360,height:160,rx:obj.type==='rectangle'?10:0};if(obj.type==='square')attrs={x:120,y:10,width:160,height:180};if(obj.type==='diamond'){tag='polygon';attrs={points:'200,5 390,100 200,195 10,100'}}if(obj.type==='ellipse'){tag='ellipse';attrs={cx:200,cy:100,rx:185,ry:90}}if(obj.type==='arrow'){tag='polygon';attrs={points:'5,70 275,70 275,20 395,100 275,180 275,130 5,130'}}if(obj.type==='line'){tag='line';attrs={x1:10,y1:100,x2:390,y2:100}}const shape=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>shape.setAttribute(k,v));shape.setAttribute('fill',obj.type==='line'?'none':obj.bg);shape.setAttribute('stroke',obj.color);shape.setAttribute('stroke-width',obj.type==='line'?8:4);svg.append(shape);box.append(svg)}
if(obj.type==='dashboard'){const div=document.createElement('div');div.className='chart';div.style.cssText='width:100%;height:calc(100% - 32px);min-height:110px';box.append(div)}
return box}
function render(obj){const item=document.querySelector('[gs-id="'+CSS.escape(obj.id)+'"]');if(!item)return;const el=item.querySelector('.grid-stack-item-content');if(charts.has(obj.id)){charts.get(obj.id).dispose();charts.delete(obj.id)}el.replaceChildren(content(obj));if(obj.type==='dashboard')drawChart(obj,el.querySelector('.chart'));item.classList.toggle('selected',selected===obj.id)}
function add(type){const obj=defaultObj(type);objects[obj.id]=obj;grid.addWidget({id:obj.id,w:type==='title'?8:6,h:type==='title'?2:4,content:''});selected=obj.id;render(obj);properties();if(type==='dashboard')openECharts(obj.id)}
function drawChart(o,element){if(!o.chart){element.textContent='Selecione o objeto e clique em Abrir ECharts nas propriedades.';return}if(!window.echarts){element.textContent='ECharts indisponível';return}if(!fiscalRows.length){element.textContent='Fonte oficial não disponível para prévia.';return}const spec=o.chart;const rows=fiscalRows.filter(r=>Number(r.ano??r.exercicio)===2025).sort((a,b)=>Number(a.bimestre)-Number(b.bimestre));const keys=(spec.metrics||[]).map(m=>fields[m]).filter(Boolean);if(!rows.length||!keys.length){element.textContent='Dimensões ou medidas indisponíveis.';return}const last=rows.at(-1);if(spec.type==='KPI'){element.textContent=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(Number(last[keys[0]]));element.style.cssText+=';font-size:25px;font-weight:700;padding:20px';return}if(spec.type==='TABLE'){const table=document.createElement('table');table.style.width='100%';const head=document.createElement('tr');['Bimestre',...spec.metrics].forEach(v=>{const th=document.createElement('th');th.textContent=v;head.append(th)});table.append(head);rows.forEach(r=>{const tr=document.createElement('tr');[r.bimestre+'º',...keys.map(k=>Number(r[k]).toLocaleString('pt-BR'))].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});table.append(tr)});element.append(table);return}const pie=['PIE','DONUT'].includes(spec.type),horizontal=spec.type==='HORIZONTAL';const option={color:spec.colors,tooltip:{trigger:pie?'item':'axis'},legend:{top:0},grid:{left:75,right:20,top:40,bottom:35}};if(pie){option.series=[{type:'pie',radius:spec.type==='DONUT'?['40%','70%']:'70%',data:rows.map(r=>({name:r.bimestre+'º',value:Number(r[keys[0]])}))}]}else{const cat={type:'category',data:rows.map(r=>r.bimestre+'º bim.')},val={type:'value'};option.xAxis=horizontal?val:cat;option.yAxis=horizontal?cat:val;option.series=keys.map((k,i)=>({name:spec.metrics[i],type:['LINE','AREA'].includes(spec.type)?'line':'bar',areaStyle:spec.type==='AREA'?{}:undefined,stack:spec.type==='STACK'?'total':undefined,data:rows.map(r=>Number(r[k]))}))}const chart=echarts.init(element);charts.set(o.id,chart);chart.setOption(option);new ResizeObserver(()=>{if(charts.get(o.id)===chart)chart.resize()}).observe(element)}
function openECharts(id){selected=id;const modal=$('echarts-modal');modal.style.display='flex';$('echarts-frame').src='/echarts-studio.html?embed=1&product='+encodeURIComponent(PRODUCT||'')+'&object='+encodeURIComponent(id)}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==$('echarts-frame').contentWindow||e.data?.type!=='bi-factory:chart-selected')return;const o=objects[selected];if(!o||o.type!=='dashboard')return;o.chart=e.data.chart;fiscalRows=Array.isArray(e.data.rows)?e.data.rows:[];o.title=o.chart.title;render(o);properties();closeECharts();$('status').textContent='Gráfico ECharts inserido. Clique em Salvar para persistir o layout.'});
function closeECharts(){$('echarts-modal').style.display='none';$('echarts-frame').src='about:blank'}
function properties(){const root=$('properties');root.replaceChildren();const o=objects[selected];if(!o){root.textContent='Selecione um objeto.';return}
function field(name,key,kind='text'){const label=document.createElement('label');label.textContent=name;const input=document.createElement(kind==='textarea'?'textarea':'input');if(kind!=='textarea')input.type=kind;input.value=o[key]||'';input.addEventListener('input',()=>{o[key]=kind==='number'?Number(input.value):input.value;render(o)});root.append(label,input)}
field('Título','title');if(o.type==='text')field('Texto','text','textarea');if(o.type==='image')field('Imagem (URL HTTPS)','image');if(o.type==='text'||o.type==='title')field('Tamanho da fonte','size','number');if(o.type==='dashboard'){const open=document.createElement('button');open.textContent=o.chart?'Editar no ECharts':'Abrir estúdio ECharts';open.className='primary';open.style.marginTop='12px';open.onclick=()=>openECharts(o.id);root.append(open);const info=document.createElement('p');info.className='muted';info.textContent=o.chart?'Visualização: '+o.chart.type+' · Medidas: '+o.chart.metrics.join(', '):'Escolha dimensões, medidas e indicadores no estúdio ECharts.';root.append(info)}field('Fundo','bg','color');field('Cor do texto','color','color');
const del=document.createElement('button');del.textContent='Excluir objeto';del.style.marginTop='20px';del.onclick=()=>{grid.removeWidget(document.querySelector('[gs-id="'+CSS.escape(o.id)+'"]'));delete objects[o.id];selected=null;properties()};root.append(del)}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
grid.on('added',(_e,items)=>items.forEach(item=>{const id=item.id;if(objects[id])render(objects[id])}));
document.querySelector('.grid-stack').addEventListener('click',e=>{const el=e.target.closest('.grid-stack-item');if(!el)return;selected=el.getAttribute('gs-id');Object.values(objects).forEach(render);properties()});
function serialize(){return {schema:'bi-factory-editor-poc-v1',objects,layout:grid.save(false)}}
function restore(data){if(data?.schema!=='bi-factory-editor-poc-v1'||!data.objects||!Array.isArray(data.layout))throw Error('Formato incompatível');charts.forEach(c=>c.dispose());charts.clear();grid.removeAll();objects={};for(const w of data.layout){const o=data.objects[w.id];if(!o||!['text','title','image','dashboard','rectangle','square','diamond','ellipse','arrow','line'].includes(o.type))continue;objects[w.id]={...defaultObj(o.type),...o,id:w.id};grid.addWidget({id:w.id,x:w.x,y:w.y,w:w.w,h:w.h,content:''});render(objects[w.id])}selected=null;properties()}
$('save').onclick=async()=>{try{const data=serialize();if(PRODUCT){const r=await fetch('/api/products/'+encodeURIComponent(PRODUCT)+'/layout',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error((await r.json()).error||'Falha ao salvar');$('status').textContent='Layout salvo no catálogo do produto.'}else{localStorage.setItem(KEY,JSON.stringify(data));$('status').textContent='Layout salvo neste navegador.'}}catch(e){$('status').textContent='Erro ao salvar: '+e.message}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(serialize(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bi-factory-layout.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{try{const raw=await e.target.files[0].text();restore(JSON.parse(raw));$('status').textContent='Layout importado.'}catch(err){alert('Não foi possível importar: '+err.message)}e.target.value=''};
$('preview').onclick=()=>{preview=!preview;document.body.classList.toggle('preview',preview);grid.setStatic(preview);$('preview').textContent=preview?'Voltar à edição':'Visualizar'};
(async()=>{try{if(PRODUCT){const p=await fetch('/api/products/'+encodeURIComponent(PRODUCT));if(!p.ok)throw Error('Produto não encontrado');const product=await p.json();$('product-name').textContent=product.name+' · Editor visual';const r=await fetch('/api/products/'+encodeURIComponent(PRODUCT)+'/layout');if(!r.ok)throw Error('Layout indisponível');const layout=await r.json();if(layout)restore(layout);$('status').textContent='Produto '+product.code+' · '+product.type+' · '+product.status}else{const saved=localStorage.getItem(KEY);if(saved)restore(JSON.parse(saved))}}catch(err){$('status').textContent='Não foi possível abrir o produto: '+err.message}})();
</script><div id="echarts-modal" role="dialog" aria-modal="true" aria-label="Estúdio ECharts" style="display:none;position:fixed;inset:0;background:#152c45b8;z-index:100;align-items:center;justify-content:center;padding:16px"><div style="background:white;width:min(1500px,98vw);height:94vh;border-radius:12px;display:flex;flex-direction:column;overflow:hidden"><div style="padding:10px 18px;display:flex;justify-content:space-between;align-items:center"><strong>Estúdio completo · Apache ECharts</strong><button onclick="closeECharts()">Fechar</button></div><iframe id="echarts-frame" title="Estúdio ECharts" style="width:100%;flex:1;border:0"></iframe></div></div></body></html>
