if(o.type!=='text')field('Título','title');if(o.type==='text'){field('Texto','text','textarea');const family=document.createElement('select');for(const name of ['Arial','Georgia','Verdana','Tahoma','Times New Roman','Courier New']){const option=document.createElement('option');option.value=name;option.textContent=name;family.append(option)}family.value=o.fontFamily||'Arial';family.onchange=()=>{remember();o.fontFamily=family.value;render(o)};const label=document.createElement('label');label.textContent='Tipo de fonte';root.append(label,family);for(const [key,labelText] of [['bold','Negrito'],['italic','Itálico']]){const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.style.width='auto';check.checked=Boolean(o[key]);check.onchange=()=>{remember();o[key]=check.checked;render(o)};label.append(check,document.createTextNode(' '+labelText));root.append(label)}}if(o.type==='image'){field('Imagem (URL HTTPS)','image');const upload=document.createElement('button');upload.textContent='Enviar imagem do computador';upload.onclick=()=>$('image-upload').click();root.append(upload)}if(o.type==='text'||o.type==='title')field('Tamanho da fonte','size','number');if(o.type==='filter'){const label=document.createElement('label');label.textContent='Dimensão';const select=document.createElement('select');Object.entries(DIMENSIONS).forEach(([id,dim])=>{const option=document.createElement('option');option.value=id;option.textContent=dim.label;select.append(option)});select.value=o.dimension;select.onchange=()=>{if(!usedDimensions().has(select.value)){offerNewChart('dimensão',DIMENSIONS[select.value]?.label||select.value);select.value=o.dimension;return}o.dimension=select.value;render(o)};root.append(label,select);const note=document.createElement('p');note.className='muted';note.textContent='Dimensões não utilizadas exigem um novo objeto ECharts.';root.append(note)}if(o.type==='filter_panel'){const label=document.createElement('label');label.textContent='Dimensões exibidas (marque quantas quiser)';root.append(label);for(const [id,dim] of Object.entries(DIMENSIONS)){const row=document.createElement('label');row.style.cssText='display:flex;align-items:center;gap:8px;font-weight:normal;margin-top:8px';const check=document.createElement('input');check.type='checkbox';check.style.cssText='width:auto;margin:0';check.checked=(o.dimensions||[]).includes(id);check.onchange=()=>{if(check.checked&&!usedDimensions().has(id)){offerNewChart('dimensão',dim.label);check.checked=false;return}const next=new Set(o.dimensions||[]);if(check.checked)next.add(id);else next.delete(id);o.dimensions=[...next];render(o)};row.append(check,document.createTextNode(dim.label));root.append(row)}const orientation=document.createElement('select');for(const [id,label] of [['vertical','Vertical'],['horizontal','Horizontal']]){const option=document.createElement('option');option.value=id;option.textContent=label;orientation.append(option)}orientation.value=o.filterLayout||'vertical';orientation.onchange=()=>{o.filterLayout=orientation.value;render(o)};root.append(document.createElement('label'),orientation);orientation.previousSibling.textContent='Organização dos filtros'}if(o.type==='measure_filter'){const p=document.createElement('p');p.className='muted';p.textContent='Somente medidas já utilizadas por objetos ECharts podem ser selecionadas. Gráficos de outras medidas permanecem inalterados.';root.append(p);const unused=document.createElement('select');const first=document.createElement('option');first.value='';first.textContent='Solicitar nova medida / objeto';unused.append(first);Object.keys(fields).filter(name=>!usedMeasures().has(name)).forEach(name=>{const option=document.createElement('option');option.value=name;option.textContent=name;unused.append(option)});unused.onchange=()=>{if(unused.value)offerNewChart('medida',unused.value);unused.value=''};root.append(unused)}if(o.type==='dashboard'){const open=document.createElement('button');open.textContent=o.chart?'Editar no ECharts':'Abrir estúdio ECharts';open.className='primary';open.style.marginTop='12px';open.onclick=()=>openECharts(o.id);root.append(open);const single=document.createElement('p');single.className='muted';single.textContent='O ECharts cria ou edita apenas um objeto por vez.';root.append(single);const info=document.createElement('p');info.className='muted';info.textContent=o.chart?'Visualização: '+o.chart.type+' · Medidas: '+o.chart.metrics.join(', '):'Escolha dimensões, medidas e indicadores no estúdio ECharts.';root.append(info)}if(isShape(o.type)){field('Cor do preenchimento','bg','color');field('Cor do contorno','color','color')}else{field('Fundo','bg','color');field('Cor do texto','color')}if(!isShape(o.type)){const label=document.createElement('label');label.textContent='Borda da caixa';const select=document.createElement('select');for(const [value,name] of [['transparent','Transparente / sem borda'],['#203047','Escura'],['#1769ad','Azul'],['#ffffff','Branca'],['custom','Personalizada']]){const option=document.createElement('option');option.value=value;option.textContent=name;select.append(option)}select.value=['transparent','#203047','#1769ad','#ffffff'].includes(o.borderColor)?o.borderColor:'custom';select.onchange=()=>{remember();o.borderColor=select.value==='custom'?'#000000':select.value;render(o);properties()};root.append(label,select);if(select.value==='custom')field('Cor personalizada da borda','borderColor','color');field('Espessura da borda (px)','borderWidth','number')}if(['rectangle','square','diamond','ellipse','arrow','line','image','text','title','filter','filter_panel','measure_filter'].includes(o.type)){field('Opacidade (%)','opacity','number');if(isShape(o.type)){field('Posição horizontal (px)','left','number');field('Posição vertical (px)','top','number');field('Largura (px)','width','number');field('Altura (px)','height','number');const note=document.createElement('p');note.className='muted';note.textContent='Arraste a figura livremente sobre textos, gráficos e outras figuras. Use o canto inferior direito para redimensionar.';root.append(note)} field('Rotação (graus)','rotation','number');const row=document.createElement('div');row.style.cssText='display:flex;gap:6px;margin-top:12px;flex-wrap:wrap';for(const [label,delta] of [['Trazer à frente',100],['Enviar para trás',-100]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{o.z=Math.max(-1000,Math.min(1000,(o.z||1)+delta));render(o)};row.append(b)}root.append(row)}

fetch('/api/fiscal').then(r=>r.ok?r.json():[]).then(rows=>{if(Array.isArray(rows)){fiscalRows=rows;Object.values(objects).filter(o=>['dashboard','filter','filter_panel'].includes(o.type)).forEach(render)}}).catch(()=>{});
$('image-upload').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>2*1024*1024||!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)){alert('Use PNG, JPG, WebP ou GIF com até 2 MB.');return}const obj=objects[selected];if(!obj||obj.type!=='image')return;const reader=new FileReader();reader.onload=()=>{obj.image=reader.result;render(obj);properties()};reader.readAsDataURL(file);e.target.value=''};
function deleteSelection(){remember();for(const id of selectedSet.size?selectedSet:new Set(selected?[selected]:[])){const overlay=document.querySelector('[data-shape-id="'+CSS.escape(id)+'"]');if(overlay)overlay.remove();const el=document.querySelector('[gs-id="'+CSS.escape(id)+'"]');if(el)grid.removeWidget(el);delete objects[id];const chart=charts.get(id);if(chart){chart.dispose();charts.delete(id)}}selected=null;selectedSet.clear();properties()}
$('delete-selected').onclick=deleteSelection;
$('group-selected').onclick=()=>{if(selectedSet.size<2){$('status').textContent='Use Ctrl+clique para selecionar dois ou mais objetos.';return}remember();const gid=crypto.randomUUID();selectedSet.forEach(id=>{if(objects[id])objects[id].group=gid});$('status').textContent=selectedSet.size+' objetos agrupados (seleção conjunta).'};
$('ungroup-selected').onclick=()=>{remember();selectedSet.forEach(id=>{if(objects[id])objects[id].group=null});$('status').textContent='Objetos desagrupados.'};

document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));$('clear-filters').onclick=()=>{selections={};measureSelections={};Object.values(objects).filter(o=>['filter','filter_panel','measure_filter','dashboard'].includes(o.type)).forEach(render)};

document.querySelector('.grid-stack').addEventListener('click',e=>{const el=e.target.closest('.grid-stack-item');if(!el)return;const id=el.getAttribute('gs-id');if(e.ctrlKey||e.metaKey){if(selectedSet.has(id))selectedSet.delete(id);else selectedSet.add(id)}else{const gid=objects[id]?.group;selectedSet=new Set(gid?Object.keys(objects).filter(k=>objects[k].group===gid):[id])}selected=id;Object.values(objects).forEach(render);properties()});
function serialize(){return {schema:'bi-factory-editor-poc-v1',objects,layout:grid.save(false),filters:{selections,measureSelections}}}
function restore(data){if(data?.schema!=='bi-factory-editor-poc-v1'||!data.objects||!Array.isArray(data.layout))throw Error('Formato incompatível');charts.forEach(c=>c.dispose());charts.clear();grid.removeAll();document.querySelectorAll('[data-shape-id]').forEach(n=>n.remove());objects={};selections={...(data.filters?.selections||{})};measureSelections={...(data.filters?.measureSelections||{})};for(const [id,o] of Object.entries(data.objects)){if(isShape(o.type)){objects[id]={...defaultObj(o.type),...o,id};if(!Number.isFinite(Number(o.left))){const old=data.layout.find(w=>w.id===id);objects[id].left=(old?.x||0)*80;objects[id].top=(old?.y||0)*72;objects[id].width=(old?.w||3)*80;objects[id].height=(old?.h||2)*72}renderShape(objects[id])}}for(const w of data.layout){const o=data.objects[w.id];if(!o||isShape(o.type)||!['text','title','image','dashboard','filter','filter_panel','measure_filter'].includes(o.type))continue;objects[w.id]={...defaultObj(o.type),...o,id:w.id};grid.addWidget({id:w.id,x:w.x,y:w.y,w:w.w,h:w.h,content:''});render(objects[w.id])}selected=null;selectedSet.clear();properties()}

$('save').onclick=async()=>{const button=$('save');if(button.disabled)return;button.disabled=true;const oldLabel=button.textContent;button.textContent='Salvando produto…';$('status').textContent='Salvando produto…';try{const data=serialize();if(PRODUCT){const r=await fetch('/api/products/'+encodeURIComponent(PRODUCT)+'/layout',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error((await r.json()).error||'Falha ao salvar');$('status').textContent='Layout salvo no catálogo do produto.';if(window.parent!==window)window.parent.postMessage({type:'bi-factory:layout-saved',product:PRODUCT},location.origin)}else{localStorage.setItem(KEY,JSON.stringify(data));$('status').textContent='Layout salvo neste navegador.'}}catch(e){$('status').textContent='Erro ao salvar: '+e.message}finally{button.disabled=false;button.textContent=oldLabel}};

$('preview').onclick=()=>{preview=!preview;document.body.classList.toggle('preview',preview);grid.setStatic(preview);document.querySelectorAll('.resize-shape').forEach(n=>n.style.display=preview?'none':'');$('preview').textContent=preview?'Voltar à edição':'Visualizar'};
(async()=>{try{if(PRODUCT){const p=await fetch('/api/products/'+encodeURIComponent(PRODUCT));if(!p.ok)throw Error('Produto não encontrado');const product=await p.json();$('product-name').textContent=product.name+' · Editor visual';const r=await fetch('/api/products/'+encodeURIComponent(PRODUCT)+'/layout');if(!r.ok)throw Error('Layout indisponível');const layout=await r.json();if(layout&&layout.schema==='bi-factory-editor-poc-v1')restore(layout);if(Object.values(objects).some(o=>o.type==='dashboard'&&o.chart))loadFiscalRows();else if(layout!==null&&layout!==undefined&&Object.keys(layout).length)$('status').textContent='Formato de layout não reconhecido; conteúdo preservado no servidor.';if(READ_ONLY){preview=true;document.body.classList.add('preview');grid.setStatic(true);document.querySelectorAll('.resize-shape').forEach(n=>n.style.display='none');document.querySelector('header').style.display='none';document.querySelector('.layout').style.minHeight='100vh';document.querySelectorAll('[data-shape-id]').forEach(n=>n.style.pointerEvents='none')}$('status').textContent='Produto ' + product.code + ' · ' + product.type + ' · ' + product.status}else{const saved=localStorage.getItem(KEY);if(saved)restore(JSON.parse(saved))}}catch(err){$('status').textContent='Não foi possível abrir o produto: '+err.message}})();
