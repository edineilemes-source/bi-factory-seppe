<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BI Factory — Estúdio Visual</title><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:#203047;background:#f4f7fb}header{padding:16px 22px;background:white;border-bottom:1px solid #dae2ec;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}button{padding:9px 12px;border:1px solid #cdd9e7;border-radius:8px;background:white;cursor:pointer}button.primary{background:#1769ad;color:white}.layout{display:grid;grid-template-columns:235px minmax(380px,1fr) 265px;min-height:calc(100vh - 72px)}aside{padding:16px;background:white;border-right:1px solid #dde4ee}aside.right{border-right:0;border-left:1px solid #dde4ee}h2{font-size:15px}main{padding:18px;min-width:0}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.canvas{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;min-height:450px;padding:12px;border:2px dashed #d5e0eb;border-radius:10px}.tile{grid-column:span 6;min-width:0;background:white;padding:12px;border:1px solid #d7e0ea;border-radius:10px;cursor:grab}.tile.selected{outline:2px solid #2376bf}.head{display:flex;justify-content:space-between;align-items:center}.plot{height:265px}.empty{grid-column:span 12;text-align:center;padding:85px 10px;color:#77879c}.field{border-bottom:1px solid #e6edf4;padding:9px 0}.note{font-size:12px;color:#62758a;line-height:1.5}label{display:block;font-weight:bold;font-size:12px;margin:14px 0 5px}select,input{width:100%;padding:8px;border:1px solid #cdd9e7;border-radius:6px}select[multiple]{height:145px}input[type=color]{height:35px;padding:2px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:right}td:first-child,th:first-child{text-align:left}@media(max-width:1000px){.layout{grid-template-columns:200px 1fr}.right{grid-column:1/-1}}@media(max-width:650px){.layout{display:block}.tile{grid-column:span 12}}
.preview-mode header button,.preview-mode aside,.preview-mode .toolbar,.preview-mode .tile button{display:none!important}.preview-mode .layout{display:block;min-height:0}.preview-mode main{padding:12px}.preview-mode .canvas{border:0;min-height:300px}.preview-mode .tile{cursor:default;pointer-events:none}.preview-mode header{padding:12px 18px}.preview-mode .plot{pointer-events:auto}
</style></head><body><header><div><h1>BI Factory · Estúdio Visual</h1><div id="status" class="note">Carregando dados…</div></div><div><button id="publish-all" class="primary">Atualizar tudo na 8503</button> <button id="clear">Página vazia</button> <button id="save" class="primary">Exportar JSON</button></div></header><div class="layout"><aside><h2>Conjunto de dados</h2><p class="note">SICONFI/RREO · 2025. Valores acumulados por bimestre.</p><h2>Dimensões</h2><div class="field">Ano</div><div class="field">Bimestre</div><h2>Métricas</h2><div id="fields"></div></aside><main><div id="toolbar" class="toolbar"></div><div id="canvas" class="canvas"></div></main><aside class="right"><h2>Propriedades</h2><div id="props" class="note">Selecione um gráfico.</div></aside></div><script>
const embedded=true;
const params=new URLSearchParams(location.search);
const preview=params.get("preview")==="1";
const productMode=params.get("product")==="1";
if(preview){document.documentElement.classList.add("preview-mode");}
const fields={"Receita realizada":"receita_realizada_acumulada","Despesa empenhada":"despesa_empenhada_acumulada","Despesa liquidada":"despesa_liquidada_acumulada","Despesa paga":"despesa_paga_acumulada","Resultado orçamentário formal":"resultado_orcamentario_formal","Margem receita × liquidada":"margem_receita_menos_liquidada","Liquidada não paga":"liquidada_nao_paga"};
const types=[["KPI","KPI"],["LINE","Linhas"],["BAR","Colunas"],["STACK","Empilhadas"],["HORIZONTAL","Barras"],["AREA","Área"],["PIE","Pizza"],["DONUT","Rosca"],["TABLE","Tabela"]];
const colors=["#168BAF","#E3A243","#35A78B","#727AD1","#D65A75"];let data=[],items=[],selected=null,charts=[],loadedProduct=null;
const el=id=>document.getElementById(id),node=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n},money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}).format(v);
function sendAll(){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:{action:"sync_all",components:items.map(({id,type,title,metrics,width,bg,text,colors})=>({id,type,title,metrics,width,bg,text,colors})),product_id:loadedProduct,event_id:crypto.randomUUID()},dataType:"json"},"*");el("status").textContent="Sincronizando produto completo com a 8503…"}
el("publish-all").onclick=()=>window.parent.postMessage({type:productMode?"bi-factory:save-product":"bi-factory:save-component",components:items},location.origin);
function sendPublication(item){const event={action:"publish",component:item,product_id:loadedProduct,event_id:crypto.randomUUID()};window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:event,dataType:"json"},"*");const status=el("status");status.textContent="Envio solicitado para 8503 · aguardando confirmação da BI Factory";}
function sendRemoval(item){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:{action:"unpublish",component:{id:item.id},product_id:loadedProduct,event_id:crypto.randomUUID()},dataType:"json"},"*");el("status").textContent="Retirada solicitada · aguardando confirmação da BI Factory"}
function redraw(){charts.forEach(c=>c.dispose());charts=[];const root=el("canvas");root.replaceChildren();if(!items.length){const n=node("div","Selecione um tipo de gráfico acima para começar.");n.className="empty";root.append(n)}
items.forEach(item=>{const tile=node("section");tile.className="tile"+(item.id===selected?" selected":"");tile.style.gridColumn="span "+item.width;tile.style.background=item.bg;tile.style.color=item.text;tile.draggable=true;tile.ondragstart=e=>e.dataTransfer.setData("text/plain",item.id);tile.ondragover=e=>e.preventDefault();tile.ondrop=e=>{e.preventDefault();const a=items.findIndex(x=>x.id===e.dataTransfer.getData("text/plain")),b=items.indexOf(item);if(a<0)return;items.splice(b,0,items.splice(a,1)[0]);redraw()};tile.onclick=()=>{selected=item.id;redraw();properties()};const head=node("div");head.className="head";head.append(node("strong",item.title));const close=node("button","×");close.onclick=e=>{e.stopPropagation();items=items.filter(x=>x!==item);if(selected===item.id)selected=null;redraw();properties()};head.append(close);tile.append(head);const plot=node("div");plot.className="plot";tile.append(plot);const publish=node("button",item.published?"Atualizar na 8503":"Enviar para 8503");publish.className="primary";publish.style.marginTop="10px";publish.onclick=e=>{e.stopPropagation();sendPublication(item)};if(!embedded)tile.append(publish);if(!embedded&&item.published){const unpublish=node("button","Retirar da 8503");unpublish.style.marginLeft="8px";unpublish.onclick=e=>{e.stopPropagation();sendRemoval(item)};tile.append(unpublish)}root.append(tile);draw(item,plot)})}
function draw(item,plot){const rows=data.filter(r=>Number(r.ano??r.exercicio)===2025).sort((a,b)=>Number(a.bimestre)-Number(b.bimestre)),keys=item.metrics.map(m=>fields[m]);if(!rows.length){plot.textContent="Não há registros para o exercício selecionado. Verifique o campo ano/exercicio.";return}if(item.type==="KPI"){plot.style.padding="65px 10px";plot.style.fontSize="28px";plot.textContent=money(Number(rows.at(-1)[keys[0]]));return}if(item.type==="TABLE"){const t=node("table"),h=node("tr");["Bimestre",...item.metrics].forEach(x=>h.append(node("th",x)));t.append(h);rows.forEach(r=>{const tr=node("tr");[r.bimestre+"º",...keys.map(k=>money(Number(r[k])))].forEach(v=>tr.append(node("td",v)));t.append(tr)});plot.style.overflow="auto";plot.append(t);return}if(!window.echarts){plot.textContent="ECharts indisponível";return}const chart=echarts.init(plot);charts.push(chart);const labels=rows.map(r=>r.bimestre+"º bim."),horizontal=item.type==="HORIZONTAL";let opt={color:item.metrics.map((_,i)=>item.colors[i]||colors[i%colors.length]),legend:{top:0},tooltip:{trigger:"axis"},grid:{left:80,right:25,top:45,bottom:35},textStyle:{color:item.text}};
if(item.type==="PIE"||item.type==="DONUT"){opt.tooltip={trigger:"item"};opt.series=[{type:"pie",radius:item.type==="DONUT"?["40%","70%"]:"70%",data:rows.map(r=>({name:r.bimestre+"º",value:Number(r[keys[0]])}))}]}else{const cat={type:"category",data:labels},val={type:"value",axisLabel:{formatter:v=>(v/1e9).toFixed(1)+" bi"}};opt.xAxis=horizontal?val:cat;opt.yAxis=horizontal?cat:val;opt.series=keys.map((k,i)=>({name:item.metrics[i],type:["LINE","AREA"].includes(item.type)?"line":"bar",areaStyle:item.type==="AREA"?{}:undefined,stack:item.type==="STACK"?"total":undefined,data:rows.map(r=>Number(r[k]))}))}chart.setOption(opt)}
function properties(){const root=el("props");root.replaceChildren();const item=items.find(x=>x.id===selected);if(!item){root.textContent="Selecione um gráfico.";return}function field(label,control){root.append(node("label",label));root.append(control)}const title=node("input");title.value=item.title;title.onchange=()=>{item.title=title.value;redraw()};field("Título",title);const sel=node("select");sel.multiple=true;Object.keys(fields).forEach(m=>{const o=node("option",m);o.value=m;o.selected=item.metrics.includes(m);sel.append(o)});field("Métricas (Ctrl+clique)",sel);const apply=node("button","Aplicar métricas e desenhar gráfico");apply.className="primary";apply.style.marginTop="8px";apply.style.width="100%";apply.onclick=()=>{const v=[...sel.selectedOptions].map(o=>o.value);if(!v.length){alert("Selecione pelo menos uma métrica.");return}item.metrics=item.type==="KPI"?v.slice(0,1):v;item.colors=item.metrics.map((_,i)=>item.colors[i]||colors[i%colors.length]);redraw();properties()};root.append(apply);const width=node("select");[3,4,6,8,12].forEach(w=>{const o=node("option",w+" colunas");o.value=w;o.selected=item.width===w;width.append(o)});width.onchange=()=>{item.width=Number(width.value);redraw()};field("Largura",width);for(const [key,label] of [["bg","Cor de fundo"],["text","Cor do texto"]]){const c=node("input");c.type="color";c.value=item[key];c.oninput=()=>{item[key]=c.value;redraw()};field(label,c)}item.metrics.forEach((m,i)=>{const c=node("input");c.type="color";c.value=item.colors[i]||colors[i%colors.length];c.oninput=()=>{item.colors[i]=c.value;redraw()};field("Cor da série: "+m,c)});root.append(node("p","Arraste os gráficos para reorganizar."))}
types.forEach(([type,label])=>{const b=node("button","+ "+label);b.onclick=()=>{const m=Object.keys(fields)[0],item={id:String(Date.now())+Math.random(),type,title:label+" — "+m,metrics:[m],width:type==="KPI"?3:6,bg:"#ffffff",text:"#203047",colors:[colors[0]]};items.push(item);selected=item.id;redraw();properties()};el("toolbar").append(b)});
Object.keys(fields).forEach(m=>{const n=node("div",m);n.className="field";el("fields").append(n)});
el("publish-all").textContent="Salvar componente";
el("save").style.display="none";
document.querySelector("header h1").textContent="BI Factory · Estúdio Visual de componentes";
window.addEventListener("message",event=>{
 if(event.origin!==location.origin||!["bi-factory:load-component","bi-factory:load-product","bi-factory:preview"].includes(event.data?.type))return;
 const saved=event.data.type==="bi-factory:preview"||event.data.type==="bi-factory:load-product"?event.data.items:event.data.component?.content?.studio_items;
 items=Array.isArray(saved)?saved.map(item=>({...item})):[];
 selected=items[0]?.id||null;redraw();properties();
});
el("clear").onclick=()=>{if(items.length&&!confirm("Limpar todos os objetos?"))return;items=[];selected=null;redraw();properties()};
el("save").onclick=()=>{const blob=new Blob([JSON.stringify({source:"SICONFI RREO 2025",components:items},null,2)],{type:"application/json"});const a=node("a");a.href=URL.createObjectURL(blob);a.download="bi-factory-studio.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
(window.BI_FACTORY_DATA ? Promise.resolve(window.BI_FACTORY_DATA) : fetch("/api/studio-fiscal").then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(result=>result.rows||[])).then(rows=>{data=rows;el("status").textContent=rows.length+" registros · fonte oficial";redraw()}).catch(e=>el("status").textContent="Falha na fonte: "+e.message);redraw();
window.addEventListener("message",e=>{if(e.data?.type!=="streamlit:render")return;const args=e.data.args||{};if(Array.isArray(args.rows)){data=args.rows;el("status").textContent=data.length+" registros · fonte oficial";redraw()}if(args.load_published===true&&Array.isArray(args.published_components)&&!window.__publishedLoaded){window.__publishedLoaded=true;loadedProduct=args.product_id||null;const names=Object.entries(fields);items=args.published_components.map((c,i)=>{const subtype=c.visual_subtype||c.component_type||"LINE";const metrics=(c.metrics||[]).map(m=>m.label||names.find(([,key])=>key===m.field)?.[0]).filter(m=>fields[m]);return {id:String(c.id||"legacy-"+i),type:subtype,title:c.title||"Gráfico",metrics:metrics.length?metrics:[names[0][0]],width:Number(c.position?.width)||6,bg:c.background_color||"#ffffff",text:c.text_color||"#203047",colors:c.series_colors||[],published:true}});selected=items[0]?.id||null;redraw();properties()}if(args.result){el("status").textContent=args.result.message||args.result;if(args.result.id){const item=items.find(i=>i.id===args.result.id);if(item){item.published=args.result.published;redraw()}}}});window.parent.postMessage({type:"bi-factory:studio-ready"},location.origin);
</script></body></html>
