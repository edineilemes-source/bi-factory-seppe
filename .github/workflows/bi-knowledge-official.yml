name: Pesquisa de Conhecimento Oficial
on:
  push:
    paths:
      - 'scripts/bi_knowledge_official.py'
      - 'scripts/instalar_download_automatico_conhecimento.py'
      - 'scripts/bi_knowledge_library.py'
      - 'scripts/test_knowledge_library.py'
      - 'scripts/bi_factory_projects.py'
      - 'web/bi_factory/src/KnowledgeLibrary.jsx'
      - 'web/bi_factory/src/ModelKnowledgeContext.jsx'
      - 'web/bi_factory/src/DataWorkspace.jsx'
      - 'requirements-knowledge.txt'
      - 'scripts/instalar_biblioteca_ia_modelagem.py'
      - 'scripts/test_instalar_biblioteca_modelagem.py'
      - 'scripts/instalar_conhecimento_oficial.py'
      - 'scripts/instalar_conhecimento_oficial_compat.py'
      - 'scripts/test_knowledge_compat_installer.py'
      - 'web/bi_factory/src/OfficialKnowledgeSearch.jsx'
      - 'scripts/test_knowledge_official.py'
      - 'scripts/serve_bi_factory_api.py'
      - 'web/bi_factory/src/KnowledgeStart.jsx'
      - '.github/workflows/bi-knowledge-official.yml'
  pull_request:
    paths:
      - 'scripts/bi_knowledge_official.py'
      - 'scripts/instalar_download_automatico_conhecimento.py'
      - 'scripts/bi_knowledge_library.py'
      - 'scripts/test_knowledge_library.py'
      - 'scripts/bi_factory_projects.py'
      - 'web/bi_factory/src/KnowledgeLibrary.jsx'
      - 'web/bi_factory/src/ModelKnowledgeContext.jsx'
      - 'web/bi_factory/src/DataWorkspace.jsx'
      - 'requirements-knowledge.txt'
      - 'scripts/instalar_biblioteca_ia_modelagem.py'
      - 'scripts/test_instalar_biblioteca_modelagem.py'
      - 'scripts/instalar_conhecimento_oficial.py'
      - 'scripts/test_knowledge_official.py'
      - 'scripts/serve_bi_factory_api.py'
      - 'web/bi_factory/src/KnowledgeStart.jsx'
      - '.github/workflows/bi-knowledge-official.yml'
permissions:
  contents: read
jobs:
  knowledge-and-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependência local para extrair PDFs (pypdf BSD-3)
        run: python -m pip install -r requirements-knowledge.txt
      - name: Python syntax
        run: python -m py_compile scripts/bi_knowledge_official.py scripts/bi_knowledge_library.py scripts/bi_factory_projects.py scripts/serve_bi_factory_api.py scripts/instalar_conhecimento_oficial.py scripts/instalar_conhecimento_oficial_compat.py scripts/instalar_biblioteca_ia_modelagem.py scripts/instalar_download_automatico_conhecimento.py
      - name: Pesquisa e importação, testes offline
        run: python scripts/test_knowledge_official.py
      - name: Biblioteca de PDFs, lixeira e conceitos da Modelagem
        run: python scripts/test_knowledge_library.py
      - name: Preservação da Modelagem local e integração idempotente
        run: python scripts/test_instalar_biblioteca_modelagem.py
      - name: Preservação de KnowledgeStart local e injeção sem conflito
        run: python scripts/test_knowledge_compat_installer.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/bi_factory/package-lock.json
      - name: Dependências do frontend
        working-directory: web/bi_factory
        run: npm ci
      - name: Validar sintaxe JSX do novo componente isolado
        working-directory: web/bi_factory
        run: node -e "const fs=require('fs'); const esbuild=require('esbuild'); esbuild.transformSync(fs.readFileSync('src/OfficialKnowledgeSearch.jsx','utf8'),{loader:'jsx'}); console.log('JSX componente isolado OK');"
      - name: Validar JSX da biblioteca e modelagem
        working-directory: web/bi_factory
        run: node -e "const fs=require('fs'),esbuild=require('esbuild'); ['KnowledgeLibrary.jsx','ModelKnowledgeContext.jsx'].forEach(f=>esbuild.transformSync(fs.readFileSync('src/'+f,'utf8'),{loader:'jsx'})); console.log('Biblioteca e Modelagem JSX OK')"
      - name: Compilar Conhecimento integrado ao React
        working-directory: web/bi_factory
        run: npm run build

  isolated-pypdf-codespaces:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduzir pip --target do Codespaces sem instalação global
        run: python -m pip install --no-deps --target "$GITHUB_WORKSPACE/.git/knowledge-deps" -r requirements-knowledge.txt
      - name: Testar importação do pypdf em subprocesso isolado
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONPATH: ${{ github.workspace }}/.git/knowledge-deps
        run: |
          python -c "from pypdf import PdfWriter; print('pypdf isolado OK')"
          python scripts/test_knowledge_library.py
          python scripts/test_instalar_biblioteca_modelagem.py
