name: Auditoria portas e navegador Chromium
on:
  push:
    branches: [audit/portas-navegador-20261111]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/bi_factory/package-lock.json
      - name: Dependencias UI e Playwright
        run: |
          npm ci --prefix web/bi_factory
          npm install --no-save --prefix web/bi_factory playwright@1.58.2
          cd web/bi_factory && npx playwright install --with-deps chromium
      - name: Sintaxe JavaScript embutido
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          for name in ['index.html','echarts-studio.html']:
              html=Path('prototypes/editor-visual',name).read_text()
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html)
              for code in scripts:
                  subprocess.run(['node','--check','--input-type=commonjs'],input=code,text=True,check=True)
              print(name,'scripts:',len(scripts),'PASS')
          PY
      - name: Iniciar API, editor e Vite 8504 e 8506
        run: |
          python -u scripts/serve_bi_factory_api.py --port 8505 >/tmp/api.log 2>&1 &
          python -u prototypes/editor-visual/server.py --port 8510 >/tmp/editor.log 2>&1 &
          (cd web/bi_factory && ./node_modules/.bin/vite --host 127.0.0.1 --port 8504 --strictPort >/tmp/vite8504.log 2>&1) &
          (cd web/bi_factory && ./node_modules/.bin/vite --host 127.0.0.1 --port 8506 --strictPort >/tmp/vite8506.log 2>&1) &
          sleep 8
          cat /tmp/api.log /tmp/editor.log /tmp/vite8504.log /tmp/vite8506.log
      - name: Auditoria HTTP e Chromium
        run: NODE_PATH=web/bi_factory/node_modules node scripts/audit_ports_browser.cjs
      - name: Logs finais
        if: always()
        run: |
          for f in /tmp/api.log /tmp/editor.log /tmp/vite8504.log /tmp/vite8506.log; do
            echo "=== $f ==="; tail -n 35 "$f" || true
          done
