name: Cadastro integrado React e API
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix web/bi_factory
      - run: npm run build --prefix web/bi_factory
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests/e2e -v
