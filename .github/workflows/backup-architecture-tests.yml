name: Backup architecture checks

on:
  pull_request:
    paths:
      - 'scripts/secure_backup.py'
      - 'scripts/backup_architecture.py'
      - 'scripts/backup_fixture_staging.py'
      - 'scripts/backup_fixture_generation.py'
      - 'tests/test_secure_backup.py'
      - 'tests/test_backup_architecture.py'
      - 'tests/test_backup_fixture_staging.py'
      - 'tests/test_backup_fixture_generation.py'
      - 'config/backup/policy.json'
      - 'requirements-backup.txt'
      - '.github/workflows/backup-architecture-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-backup.txt
      - name: Install isolated backup test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-backup.txt pytest==8.4.1
          python -m pip check
      - name: Verify operational execution remains disabled
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path('config/backup/policy.json').read_text())
          for key in ('execution_enabled', 'remote_enabled', 'schedule_enabled'):
              assert policy.get(key) is False, f'{key} must remain disabled'
          print('Operational execution, remote transfer and scheduling are disabled.')
          PY
      - name: Run synthetic tests only
        run: python -m pytest tests/test_secure_backup.py tests/test_backup_architecture.py tests/test_backup_fixture_staging.py tests/test_backup_fixture_generation.py -q
